name: Collecte Quotidienne & Déploiement Portail Citoyen

on:
  schedule:
    # Exécution chaque matin à 05:00 UTC (06:00 CET / 07:00 CEST Paris)
    - cron: '0 5 * * *'
  workflow_dispatch: # Permet de lancer manuellement depuis l'interface GitHub

# Permissions requises pour déployer sur GitHub Pages et mettre à jour data.json
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  scrape-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupération du code source
        uses: actions/checkout@v4

      - name: 🐍 Initialisation de Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Exécution du pipeline de collecte & tri IA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          TIMEZONE: "Europe/Paris"
        run: |
          python src/main.py

      - name: 💾 Commit & Push de data.json mis à jour
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add web/data.json
          git diff-index --quiet HEAD || git commit -m "chore(data): actualisation quotidienne $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: 🌐 Configuration de GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📦 Téléversement de l'artefact Web
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

      - name: 🚀 Déploiement sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
